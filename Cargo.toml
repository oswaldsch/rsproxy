[package]
name = "rsproxy"
version = "0.1.0"
edition = "2024"

[dependencies]
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread"] }
