[package]
name = "rsproxy"
version = "0.1.0"
edition = "2024"

[dependencies]
env_logger = "0.11.11"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread"] }
toml = "1.1.8"
